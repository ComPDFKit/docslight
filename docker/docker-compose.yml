services:
  mysql:
    # mysql:5.7 linux/arm64 image is unavailable.
    image: mysql:8.0.39
    container_name: comidp-mysql
    env_file: .env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
      - TZ=${TIMEZONE}
      - MYSQL_DATABASE=comidp
    command:
      --max_connections=1000
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --tls_version="TLSv1.2,TLSv1.3"
      --binlog_expire_logs_seconds=604800
    ports:
      - ${MYSQL_PORT}:3306
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - comidp
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-uroot", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 10s
      retries: 3
    restart: on-failure

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs-server
    ports:
      - ${RUSTFS_PORT}:9000
    environment:
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_EXTERNAL_ADDRESS=:9000
      - RUSTFS_ACCESS_KEY=${RUSTFS_USER}
      - RUSTFS_SECRET_KEY=${RUSTFS_PASSWORD}
    volumes:
      - rustfs_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "sh", "-c",
          "curl -f http://localhost:9000/health && curl -f http://localhost:9001/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - comidp
    restart: on-failure

  redis:
    # swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/valkey/valkey:8
    image: valkey/valkey:8
    container_name: comidp-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 128mb --maxmemory-policy allkeys-lru
    env_file: .env
    ports:
      - ${REDIS_PORT}:6379
    volumes:
      - redis_data:/data
    networks:
      - comidp
    restart: on-failure

  rabbitmq:
    restart: on-failure
    image: rabbitmq:3.10.0-rc.3-management
    container_name: rabbitmq_v0.2
    env_file: .env
    ports:
      - 5671:5671
      - 5672:5672
      - 4369:4369
      - 25672:25672
      - 15671:15671
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${MQ_USER}
      RABBITMQ_DEFAULT_PASS: ${MQ_PASSWORD}
    networks:
      - comidp
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
  comidp_server:
    restart: on-failure
    image: ${COMIDP_SERVER_IMAGE}
    container_name: comidp-server
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - 7000:7000
    env_file: .env
    environment:
      LICENSE_KEY: ${LICENSE_KEY}
      DB_URL: ${MYSQL_HOST}:3306/${MYSQL_DBNAME}
      DB_USERNAME: ${MYSQL_USER_NAME}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: ${REDIS_DATABASE}
      TMP_PATH: /comidp/server/out_tmp
      LOWER_ENGINE: comidp_actuator:8000
      MQ_HOST: ${MQ_HOST}
      MQ_PORT: ${MQ_PORT}
      MQ_USERNAME: ${MQ_USER}
      MQ_PASSWORD: ${MQ_PASSWORD}
      RAG_ENGINE: http://comidp-rag:9380
      RUSTFS_ACCESS_KEY: comidp
      RUSTFS_SECRET_KEY: comidp_rag
      RUSTFS_ENDPOINT: http://rustfs-server:9000
      DOC_SLIGHT_HOST: ${DOC_SLIGHT_HOST}
    volumes:
      # This needs to be mounted in the same directory as comidp_actuator
      - comidp_data:/comidp
    networks:
      - comidp
        #- comidp_actuator
  comidp_actuator:
    restart: on-failure
    image: ${COMIDP_ACTUATOR_IMAGE}
    container_name: comidp-actuator
    networks:
      - comidp
    ports:
      - 8000:8000
    environment:
      ENABLE_EXTRACTOR: "false"
      ENABLE_PARSER: "false"
      RUSTFS_HOST: rustfs-server
      TMP_PATH: /comidp/
      LICENSE_KEY: ${LICENSE_KEY}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: ${REDIS_DATABASE}
      # -----------------------------
      # MYSQL (for DMS metadata)
      # -----------------------------
    volumes:
      # This needs to be mounted in the same directory as comidp_actuator
      - comidp_data:/comidp
  comidp-frontend:
    image: ${COMIDP_WEB_IMAGE}
    container_name: comidp-frontend
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    ports:
      - ${COMIDP_PORT}:3022
      - ${ADMIN_PORT}:3033
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/mime.types:/etc/nginx/mime.types
    networks:
      - comidp
    
volumes:
  mysql_data:
    driver: local
  rustfs_data:
    driver: local
  redis_data:
    driver: local
  comidp_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  comidp:
    name: comidp
    driver: bridge