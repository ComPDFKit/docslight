[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docslight"
version = "0.1.2"
description = "Lightweight ComPDF document parsing and extraction SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "ComPDF AI", email = "support@compdf.com" },
]
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "typing-extensions>=4.8.0; python_version<'3.11'",
    "tomli>=2.0.1; python_version<'3.11'",
    "flask>=3.1.3",
    "werkzeug>=3.1.8",
]

[project.optional-dependencies]
local = [
    "Pillow>=10.0.0",
    "PyMuPDF>=1.23.0",
    "numpy>=1.24.0",
    "paddlepaddle>=3.3.0",
    "paddleocr[doc-parser]>=3.3.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.0",
]
local-llm = [
    "openai>=1.0.0",
]
web = [
    "Flask>=3.0.0",
    "Werkzeug>=3.0.0",
]
web-test = [
    "playwright>=1.40.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "build>=1.0.0",
    "twine>=4.0.0",
    "Pillow>=10.0.0",
    "PyMuPDF>=1.23.0",
    "numpy>=1.24.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.0",
    "Flask>=3.0.0",
    "Werkzeug>=3.0.0",
]

[project.scripts]
docslight = "docslight.cli:main"

[tool.setuptools.packages.find]
include = ["docslight*"]

[tool.setuptools.package-data]
docslight = ["templates/**/*", "static/**/*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
