server {
    listen 3033;
    root /app/admin/dist;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 9;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    location ~ ^/v1 {
        proxy_pass http://comidp:9380;
        include proxy.conf;
    }

    location ~ ^/api/v1 {
        proxy_pass http://comidp:5000;
        include proxy.conf;
    }

    location ~ ^/api/idp {
        proxy_pass http://comidp:7000;
        include proxy.conf;
    }


    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
