    leaderId: ${RESONAC_LEADER_ID:b0f53c2a055a11f18b7410ffe0d13cd8}
    templateList: ${RESONAC_TEMPLATE_LIST:318658d6a56a07bfef5e96dc7c6efddd,2f83821d19536ad2020c5f83df1a316a,c2fc6e52394af9498d7e38bab7913e16,d49badcc5d1181473d0748564f9ceb28,8a41d04283d22b3047d4e1caee643f91,d20de6c1be859474ecc2d78587e985d8,0ad18d0bbcbf6a46f3a84796ceb7a745,0a29ac38365d3dc944299ee3ea1aefc2,7e6ed1b3ef0073db6fc18d13ade8179f,b743afd84f98f2708f24090a166ded4c,ab68b4af6d6ab9ff3c70852b6f91be44,7261be3a04f667ad3b52b05a44bd1127,00d2408e5642b238017a62753dded83a,ef1fa83c02f212e42b5698bfa3e3b572,1ebc8ce53850e6b535fb80d31e00a4a6,693dcf0e9108d14d152b35b718a015ac,b35352a4bde6df145398fd84d42f20b4,784cd4d2f7fc1fb40e8b643901f1dde4,a46363c96ef875f5ff0eeaada15838d2,1ae1ac4cb46877c860f049e6e5f49fd1,7dca6d17141583a3a5c89c0fd965a026}
